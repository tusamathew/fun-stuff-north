<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NZ Adventure Dashboard</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-panel: #1e293b;
            --primary: #3b82f6;
            --accent: #10b981;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --card-hover: #334155;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            overflow-x: hidden;
            display: flex;
            height: 100vh;
        }

        /* --- SIDEBAR (FILTERS) --- */
        .sidebar {
            width: 260px;
            background-color: var(--bg-panel);
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            border-right: 1px solid #334155;
            flex-shrink: 0;
        }

        .brand {
            font-size: 1.5rem;
            font-weight: 800;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
        }

        .filter-group h3 {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-sub);
            margin-bottom: 10px;
        }

        .filter-btn {
            display: block;
            width: 100%;
            text-align: left;
            background: transparent;
            border: none;
            color: var(--text-main);
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.95rem;
            margin-bottom: 5px;
        }

        .filter-btn:hover { background: rgba(255,255,255,0.05); }
        .filter-btn.active { background: var(--primary); color: white; font-weight: 600; }

        /* --- MAIN CONTENT (DASHBOARD) --- */
        .main-content {
            flex-grow: 1;
            padding: 0;
            overflow-y: auto;
            position: relative;
        }

        .header {
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(15, 23, 42, 0.95);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #334155;
        }

        .view-toggles button {
            background: var(--bg-panel);
            border: 1px solid #475569;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            margin-left: 10px;
        }
        
        .view-toggles button:hover { border-color: var(--primary); }

        /* --- SWIMLANES (NETFLIX STYLE) --- */
        .category-section {
            padding: 20px 40px;
            margin-bottom: 20px;
        }

        .category-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 15px;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .category-title span {
            font-size: 0.8rem;
            background: #334155;
            padding: 2px 8px;
            border-radius: 4px;
            color: var(--accent);
        }

        .horizontal-scroll {
            display: flex;
            gap: 20px;
            overflow-x: auto;
            padding-bottom: 20px;
            scrollbar-width: thin;
            scrollbar-color: var(--primary) var(--bg-dark);
        }

        .horizontal-scroll::-webkit-scrollbar { height: 8px; }
        .horizontal-scroll::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        .horizontal-scroll::-webkit-scrollbar-track { background: transparent; }

        /* --- LANDSCAPE CARD --- */
        .card {
            min-width: 280px;
            max-width: 280px;
            background: var(--bg-panel);
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.3s, box-shadow 0.3s;
            position: relative;
            border: 1px solid #334155;
            display: flex;
            flex-direction: column;
        }

        .card:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            border-color: var(--primary);
            z-index: 10;
        }

        .card-img-placeholder {
            height: 140px;
            background: linear-gradient(135deg, #475569, #1e293b);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
        }

        .card-body {
            padding: 15px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .card h4 { margin: 0 0 5px 0; font-size: 1rem; }
        
        .meta-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: var(--text-sub);
            margin-bottom: 10px;
        }

        .tag-cloud {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-top: auto;
        }

        .tag {
            font-size: 0.7rem;
            background: rgba(59, 130, 246, 0.15);
            color: #60a5fa;
            padding: 2px 8px;
            border-radius: 4px;
        }

        .fun-meter {
            height: 4px;
            background: #334155;
            margin-top: 10px;
            border-radius: 2px;
            overflow: hidden;
        }
        
        .fun-fill {
            height: 100%;
            background: var(--accent);
        }

        /* --- INTERACTIVE OVERLAYS --- */
        .add-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: var(--primary);
            color: white;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            font-weight: bold;
            cursor: pointer;
            opacity: 0;
            transform: scale(0.8);
            transition: all 0.2s;
        }

        .card:hover .add-btn { opacity: 1; transform: scale(1); }

        /* --- MAP PLACEHOLDER --- */
        #map-panel {
            display: none;
            height: 100%;
            background: #1e293b;
            justify-content: center;
            align-items: center;
            color: var(--text-sub);
            text-align: center;
        }

        /* Responsive */
        @media (max-width: 768px) {
            body { flex-direction: column; }
            .sidebar { width: auto; padding: 15px; flex-direction: row; overflow-x: auto; gap: 10px; border-right: none; border-bottom: 1px solid #334155; }
            .filter-btn { width: auto; white-space: nowrap; margin: 0; }
            .header { padding: 15px; }
            .category-section { padding: 15px; }
        }
    </style>
</head>
